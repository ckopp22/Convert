<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFE4EF">
  <meta name="description" content="A cute little kg to lb and °C to °F converter.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Convert">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
  <title>Convert</title>
</head>
<body>
  <main class="app">
    <header>
      <h1><img class="peony" src="icons/peony.png" alt=""> Convert <img class="peony" src="icons/peony.png" alt=""></h1>
      <p class="tagline">From this to that, just like that</p>
    </header>

    <section class="card" data-card="weight" aria-labelledby="t-weight">
      <h2 id="t-weight">⚖️ <span class="from-name">Kilograms</span> → <span class="to-name">Pounds</span></h2>
      <div class="body">
        <div class="rows">
        <div class="row">
          <input class="in" type="text" inputmode="decimal" autocomplete="off" placeholder="0" aria-label="Kilograms">
          <span class="unit in-unit">kg</span>
        </div>
        <div class="row">
          <output class="result" role="button" tabindex="0" aria-live="polite" aria-label="Pounds (tap to copy)">—</output>
          <span class="unit out-unit">lb</span>
        </div>
        </div>
        <button class="swap" type="button" aria-label="Swap direction">⇅</button>
      </div>
    </section>

    <section class="card" data-card="temp" aria-labelledby="t-temp">
      <h2 id="t-temp">🌡️ <span class="from-name">Celsius</span> → <span class="to-name">Fahrenheit</span></h2>
      <div class="body">
        <div class="rows">
        <div class="row">
          <input class="in" type="text" inputmode="decimal" autocomplete="off" placeholder="0" aria-label="Celsius">
          <span class="unit in-unit">°C</span>
        </div>
        <div class="row">
          <output class="result" role="button" tabindex="0" aria-live="polite" aria-label="Fahrenheit (tap to copy)">—</output>
          <span class="unit out-unit">°F</span>
        </div>
        </div>
        <button class="swap" type="button" aria-label="Swap direction">⇅</button>
      </div>
    </section>

  </main>
  <div id="toast" class="toast" role="status" aria-live="polite">Copied! 💗</div>
  <script src="app.js"></script>
</body>
</html>
